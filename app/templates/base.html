<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shipping App{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.9" integrity="sha384-QFjmbokDn2DjBjq+fM+8LUIVrAgqcNW2s0PjAxHETgRn9l4fvX31ZxDxvwQnyMOX" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="{{ url_for('static', filename='js/manifest.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/manifest.css') }}">
    <style>
        /* Modal Styles */
        #modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            z-index: 50;
        }
        
        #modal-container:empty {
            display: none;
        }
        
        /* HTMX Indicators */
        .htmx-indicator {
            display: none;
        }
        .htmx-request .htmx-indicator {
            display: flex;
        }
        .htmx-request.htmx-indicator {
            display: flex;
        }
        
        /* Loading States */
        .htmx-request select,
        .htmx-request input,
        .htmx-request button {
            opacity: 0.7;
            cursor: wait;
        }
        
        /* Validation States */
        .error-ring {
            border-color: #f56565 !important;
            box-shadow: 0 0 0 1px #f56565 !important;
        }
        .success-ring {
            border-color: #48bb78 !important;
            box-shadow: 0 0 0 1px #48bb78 !important;
        }
        
        /* Transitions */
        .htmx-settling tr {
            transition: all 0.3s ease-out;
        }
        .htmx-swapping tr {
            opacity: 0;
            transition: all 0.3s ease-out;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        /* Debug Panel */
        #debug-panel {
            transition: all 0.3s ease-in-out;
        }
        #debug-panel[x-cloak] {
            display: none;
        }

        /* Table Container */
.table-container {
  display: block !important;
  border: 1px solid #e2e8f0;
  border-radius: 0.5rem;
  width: 100% !important;
  overflow: auto !important;
  position: relative !important;
}

/* Fixed heights for different row counts */
.table-container.rows-3 { height: 120px !important; }  /* 3 rows * 40px */
.table-container.rows-5 { height: 200px !important; }  /* 5 rows * 40px */
.table-container.rows-10 { height: 400px !important; } /* 10 rows * 40px */
.table-container.rows-20 { height: 800px !important; } /* 20 rows * 40px */
.table-container.rows-50 { height: 2000px !important; } /* 50 rows * 40px */

/* Table styles */
.table-container table {
  width: 100% !important;
  margin-bottom: 0 !important;
  border-collapse: collapse !important;
}

/* Fixed header */
.table-container thead th {
  position: sticky !important;
  top: 0 !important;
  background: white !important;
  z-index: 10 !important;
  border-bottom: 2px solid #e2e8f0 !important;
}

/* Additional Table Container Styles */
.table-container {
  display: block !important;
  overflow-y: auto !important;
}
    </style>
</head>
<body class="bg-gray-100">
{% include 'components/menu_include.html' %}

    <main id="main-content" class="container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>

    <script>
        // Enable HTMX debug logging
        htmx.logAll();
        
        // Add event listeners for HTMX events
        document.body.addEventListener('htmx:beforeRequest', function(evt) {
            console.log('HTMX Request:', evt.detail);
            
            // Hide any existing validation errors
            const validationErrors = document.getElementById('validation-errors');
            if (validationErrors) {
                validationErrors.classList.add('hidden');
            }
            
            // Clear previous error states
            document.querySelectorAll('.error-ring').forEach(el => {
                el.classList.remove('error-ring');
            });
        });
        
        document.body.addEventListener('htmx:afterRequest', function(evt) {
            console.log('HTMX Response:', evt.detail);
            
            // Check for validation errors in response
            if (evt.detail.xhr.status === 422) {
                try {
                    const errors = JSON.parse(evt.detail.xhr.responseText);
                    showValidationErrors(errors);
                } catch (e) {
                    console.error('Error parsing validation response:', e);
                }
            }
        });
        
        document.body.addEventListener('htmx:responseError', function(evt) {
            console.log('HTMX Response Error:', evt.detail);
            
            // Show error message
            const validationErrors = document.getElementById('validation-errors');
            if (validationErrors) {
                const errorMessageDiv = validationErrors.querySelector('.text-red-700');
                if (errorMessageDiv) {
                    errorMessageDiv.textContent = 'An error occurred. Please try again.';
                }
                validationErrors.classList.remove('hidden');
            }
        });
        
        // Function to display validation errors
        function showValidationErrors(errors) {
            const validationErrors = document.getElementById('validation-errors');
            if (!validationErrors) return;
            
            const errorMessageDiv = validationErrors.querySelector('.text-red-700');
            if (!errorMessageDiv) return;
            
            // Clear previous errors
            errorMessageDiv.innerHTML = '';
            
            // Add new errors
            Object.entries(errors).forEach(([field, messages]) => {
                const input = document.getElementById(field);
                if (input) {
                    input.classList.add('error-ring');
                }
                
                messages.forEach(message => {
                    const errorP = document.createElement('p');
                    errorP.textContent = message;
                    errorMessageDiv.appendChild(errorP);
                });
            });
            
            validationErrors.classList.remove('hidden');
        }
        
        // Add validation styles
        const style = document.createElement('style');
        style.textContent = `
            .error-ring {
                border-color: #f56565 !important;
                box-shadow: 0 0 0 1px #f56565 !important;
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
