<div class="modal-content bg-white rounded-lg shadow-lg max-w-4xl mx-auto mt-10 overflow-hidden">
    <div class="px-6 py-4 bg-gray-50 border-b flex justify-between items-center">
        <h3 class="text-lg font-medium text-gray-900">{{ 'Edit' if item else 'Create' }} Manifest</h3>
        <button type="button" 
                class="text-gray-400 hover:text-gray-500"
                hx-get="{{ url_for('crud.manifest.empty') }}"
                hx-target="#modal-container">
            <span class="sr-only">Close</span>
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
    
    <form hx-post="{{ url_for('crud.manifest.save_manifest', id=item.id) if item else url_for('crud.manifest.save_manifest') }}"
          hx-target="#modal-container"
          class="p-6 space-y-4">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Bill of Lading</label>
                <input type="text" 
                       name="bill_of_lading"
                       value="{{ item.bill_of_lading if item else '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Shipper</label>
                <select name="shipper_id" 
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Shipper</option>
                    {% for client in clients %}
                    <option value="{{ client[0] }}" {{ 'selected' if item and item.shipper_id == client[0] else '' }}>
                        {{ client[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Consignee</label>
                <select name="consignee_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Consignee</option>
                    {% for client in clients %}
                    <option value="{{ client[0] }}" {{ 'selected' if item and item.consignee_id == client[0] else '' }}>
                        {{ client[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Vessel</label>
                <select name="vessel_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Vessel</option>
                    {% for vessel in vessels %}
                    <option value="{{ vessel[0] }}" {{ 'selected' if item and item.vessel_id == vessel[0] else '' }}>
                        {{ vessel[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Voyage</label>
                <select name="voyage_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Voyage</option>
                    {% for voyage in voyages %}
                    <option value="{{ voyage[0] }}" {{ 'selected' if item and item.voyage_id == voyage[0] else '' }}>
                        {{ voyage[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Port of Loading</label>
                <select name="port_of_loading_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Port of Loading</option>
                    {% for port in ports %}
                    <option value="{{ port[0] }}" {{ 'selected' if item and item.port_of_loading_id == port[0] else '' }}>
                        {{ port[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Port of Discharge</label>
                <select name="port_of_discharge_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Port of Discharge</option>
                    {% for port in ports %}
                    <option value="{{ port[0] }}" {{ 'selected' if item and item.port_of_discharge_id == port[0] else '' }}>
                        {{ port[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Place of Receipt</label>
                <input type="text"
                       name="place_of_receipt"
                       value="{{ item.place_of_receipt if item else '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Place of Delivery</label>
                <input type="text"
                       name="place_of_delivery"
                       value="{{ item.place_of_delivery if item else '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Date of Receipt</label>
                <input type="date"
                       name="date_of_receipt"
                       value="{{ item.date_of_receipt if item and item.date_of_receipt else '' }}"
                       class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Manifester</label>
                <select name="manifester_id"
                        class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <option value="">Select Manifester</option>
                    {% for user in manifesters %}
                    <option value="{{ user[0] }}" {{ 'selected' if item and item.manifester_id == user[0] else '' }}>
                        {{ user[1] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700">Clauses</label>
            <textarea name="clauses"
                      rows="3"
                      class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500">{{ item.clauses if item else '' }}</textarea>
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
            <button type="button"
                    hx-get="{{ url_for('crud.manifest.empty') }}"
                    hx-target="#modal-container"
                    class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Cancel
            </button>
            <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-white bg-blue-600 border border-transparent rounded-md shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Save
            </button>
        </div>
    </form>
</div>
