<tr class="hover:bg-gray-50 group">
    <td class="px-4 py-1 whitespace-nowrap border-b text-sm">
        {{ item.bill_of_lading }}
    </td>
    <td class="px-4 py-1 whitespace-nowrap border-b text-sm">
        {{ item.shipper_name or item.shipper_id }}
    </td>
    <td class="px-4 py-1 whitespace-nowrap border-b text-sm">
        {{ item.consignee_name or item.consignee_id }}
    </td>
    <td class="px-4 py-1 whitespace-nowrap border-b text-sm">
        {{ item.vessel_name or item.vessel_id }}
    </td>
    <td class="px-4 py-1 whitespace-nowrap border-b text-sm">
        {{ item.voyage_name or item.voyage_id }}
    </td>
    <td class="w-[120px] px-4 py-1 whitespace-nowrap border-b text-sm">
        <div class="invisible group-hover:visible flex justify-end space-x-2">
            <button type="button"
                    hx-get="{{ url_for('crud.manifest.load_form', id=item.id) }}"
                    hx-target="#modal-container"
                    hx-swap="outerHTML"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-1 px-2 rounded text-sm">
                Edit
            </button>
            <button hx-delete="{{ url_for('crud.manifest.delete_manifest', id=item.id) }}"
                    hx-confirm="Are you sure you want to delete this Manifest?"
                    hx-target="closest tr"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-1 px-2 rounded text-sm">
                Delete
            </button>
        </div>
    </td>
</tr>
