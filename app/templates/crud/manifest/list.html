{% extends "base.html" %}

{% block content %}
{#<!-- Modal Container -->#}
<div id="modal-container"></div>

<div class="container mx-auto px-4 py-8">
    <div class="flex flex-col space-y-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">Manifest List</h1>
            <button hx-get="{{ url_for('crud.manifest.load_form') }}"
                    hx-target="#modal-container"
                    class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded">
                Add New Manifest
            </button>
        </div>

        <!-- Search and Filters -->
        <div class="flex flex-col space-y-4 md:flex-row md:space-y-0 md:space-x-4">
            <!-- Search -->
            <div class="w-full md:w-1/3">
                <div class="relative">
                    <input type="text"
                           class="w-full px-3 py-2 pl-10 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                           placeholder="Search manifests..."
                           hx-trigger="keyup changed delay:500ms, search"
                           hx-get="{{ url_for('crud.manifest.list_manifest') }}"
                           hx-target="#rows-container"
                           hx-indicator="#search-indicator"
                           name="search">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div id="search-indicator" class="htmx-indicator absolute inset-y-0 right-0 pr-3 flex items-center">
                        <svg class="animate-spin h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Quick Filters -->
            
        </div>

       {% include 'crud/manifest/_table_container.html' with context %}

        <!-- Table Controls -->
        <div class="flex flex-col md:flex-row justify-between items-center mt-4 space-y-4 md:space-y-0">
            <!-- Left side controls -->
            <div class="flex items-center space-x-4">
                <div class="flex items-center space-x-2">
                    <label class="text-sm text-gray-600">Show:</label>
                    <select class="border rounded px-2 py-1 text-sm"
                            hx-get="{{ url_for('crud.manifest.list_manifest') }}"
                            hx-target="#rows-container"
                            hx-include="[name='search']"
                            name="per_page">
                        <option value="3">3</option>
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="50">50</option>
                    </select>
                </div>

                <div class="text-sm text-gray-600">
                    Total: <span id="total-count">{{ total_count if total_count else '0' }}</span>
                </div>
            </div>

            <!-- Right side controls -->
            <div class="flex items-center space-x-2">
                <div id="load-more-container">
                    {% if has_more %}
                    <button hx-get="{{ url_for('crud.manifest.list_manifest', page=page+1) }}"
                            hx-target="#rows-container"
                            hx-swap="beforeend"
                            hx-include="[name='search'], [name='per_page']"
                            class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold py-2 px-4 rounded text-sm">
                        Load More
                    </button>
                    {% endif %}
                </div>

                <button hx-get="{{ url_for('crud.manifest.list_manifest') }}"
                        hx-target="#rows-container"
                        hx-include="[name='search'], [name='per_page']"
                        class="bg-gray-100 hover:bg-gray-200 text-gray-800 font-semibold p-2 rounded">
                    <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
